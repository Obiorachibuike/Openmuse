[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "openmuse-ai"
version = "1.0.0"
description = "Official Python client for the OpenMuse AI API"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "OpenMuse contributors" }]
dependencies = ["httpx>=0.27,<1"]
classifiers = ["Programming Language :: Python :: 3", "Programming Language :: Python :: 3.9", "Typing :: Typed"]

[project.urls]
Repository = "https://github.com/Obiorachibuike/Openmuse"

[tool.hatch.build.targets.wheel]
packages = ["src/openmuse"]

[tool.pytest.ini_options]
pythonpath = ["src"]
